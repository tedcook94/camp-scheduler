[tools]
go = "1.26.0"
"go:github.com/air-verse/air" = "latest"
gomigrate = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
node = "22"
pnpm = "latest"

[env]
PORT = "9100"
MODE = "local"
LOG_LEVEL = "info"
DATABASE_HOST = "localhost"
DATABASE_PORT = "5432"
DATABASE_USER = "camp_scheduler"
DATABASE_PASSWORD = "p@ss123"
DATABASE_SSL_MODE = "disable"
DATABASE_NAME = "camp_scheduler"
DATABASE_TIMEOUT = "10s"

AUTH_PORT = "9101"
AUTH_BASE_URL = "http://localhost:9101"
AUTH_SERVER_URL = "http://localhost:9101"
AUTH_SHARED_SECRET = "local-dev-shared-secret-change-me"
AUTH_TRUSTED_ORIGINS = "http://localhost:5173"
BETTER_AUTH_SECRET = "local-dev-better-auth-secret-must-be-at-least-32-chars"

DATABASE_URL = "postgres://{{env.DATABASE_USER}}:{{env.DATABASE_PASSWORD}}@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}?sslmode={{env.DATABASE_SSL_MODE}}"
DATABASE_URL_TEST = "postgres://{{env.DATABASE_USER}}:{{env.DATABASE_PASSWORD}}@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}_test?sslmode={{env.DATABASE_SSL_MODE}}"
APP_MIGRATE_URL = "postgres://{{env.DATABASE_USER}}:{{env.DATABASE_PASSWORD}}@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}?sslmode={{env.DATABASE_SSL_MODE}}&search_path=app"
APP_MIGRATE_URL_TEST = "postgres://{{env.DATABASE_USER}}:{{env.DATABASE_PASSWORD}}@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}_test?sslmode={{env.DATABASE_SSL_MODE}}&search_path=app"
AUTH_MIGRATE_URL = "postgres://{{env.DATABASE_USER}}:{{env.DATABASE_PASSWORD}}@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}?sslmode={{env.DATABASE_SSL_MODE}}&search_path=auth"
AUTH_MIGRATE_URL_TEST = "postgres://{{env.DATABASE_USER}}:{{env.DATABASE_PASSWORD}}@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}_test?sslmode={{env.DATABASE_SSL_MODE}}&search_path=auth"
APP_DATABASE_URL = "postgres://app_user:p@ss123@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}?sslmode={{env.DATABASE_SSL_MODE}}"
APP_DATABASE_URL_TEST = "postgres://app_user:p@ss123@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}_test?sslmode={{env.DATABASE_SSL_MODE}}"
AUTH_DATABASE_URL = "postgres://auth_user:p@ss123@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}?sslmode={{env.DATABASE_SSL_MODE}}"
AUTH_DATABASE_URL_TEST = "postgres://auth_user:p@ss123@{{env.DATABASE_HOST}}:{{env.DATABASE_PORT}}/{{env.DATABASE_NAME}}_test?sslmode={{env.DATABASE_SSL_MODE}}"

[tasks.dev]
description = "Start Postgres, BetterAuth auth-server, Go server, and frontend dev server"
run = """
#!/usr/bin/env bash
set -e
cleanup() {
  echo ""
  echo "Shutting down..."
  kill $AUTH_PID 2>/dev/null || true
  kill $AIR_PID 2>/dev/null || true
  kill $VITE_PID 2>/dev/null || true
  wait $AUTH_PID 2>/dev/null || true
  wait $AIR_PID 2>/dev/null || true
  wait $VITE_PID 2>/dev/null || true
  docker compose down
}
trap cleanup EXIT
docker compose up -d --wait postgres
mise run migrate:all
mise run auth:migrate
(cd auth && pnpm dev) &
AUTH_PID=$!
air &
AIR_PID=$!
(cd web && pnpm dev) &
VITE_PID=$!
wait
"""

[tasks.server]
description = "Run the Go server with hot-reload (standalone, assumes Postgres is already running)"
run = "air"

[tasks.build]
description = "Build the frontend and server binary"
run = """
#!/usr/bin/env bash
set -e
cd web && pnpm build && cd ..
find cmd/server/static -mindepth 1 ! -name '.gitkeep' -exec rm -rf {} +
cp -r web/build/. cmd/server/static/
go build -o bin/server ./cmd/server
"""

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run integration tests (starts Postgres if needed, applies migrations)"
run = """
#!/usr/bin/env bash
set -e
already_running=$(docker compose ps --status running --format json postgres 2>/dev/null | grep -c '"postgres"' || true)
cleanup() {
  if [ "$already_running" -eq 0 ]; then
    echo ""
    echo "Stopping Postgres..."
    docker compose down
  fi
}
trap cleanup EXIT
docker compose up -d --wait postgres
mise run migrate:all
go test -tags integration ./...
"""

[tasks.sqlc]
description = "Generate Go code from SQL queries"
run = "sqlc generate"

[tasks.migrate]
description = "Run app-schema migrations on the dev database"
usage = 'flag "--version <version>" help="Migrate to a specific version (omit to run all up)"'
run = """
#!/usr/bin/env bash
if [ -n "${usage_version:-}" ]; then
  migrate -database "$APP_MIGRATE_URL" -path database/migrations/app goto "$usage_version"
else
  migrate -database "$APP_MIGRATE_URL" -path database/migrations/app up
fi
"""

[tasks."migrate:test"]
description = "Run app-schema migrations on the test database"
usage = 'flag "--version <version>" help="Migrate to a specific version (omit to run all up)"'
run = """
#!/usr/bin/env bash
if [ -n "${usage_version:-}" ]; then
  migrate -database "$APP_MIGRATE_URL_TEST" -path database/migrations/app goto "$usage_version"
else
  migrate -database "$APP_MIGRATE_URL_TEST" -path database/migrations/app up
fi
"""

[tasks."migrate:all"]
description = "Run app-schema migrations on both dev and test databases"
depends = ["migrate", "migrate:test"]

[tasks.migration]
description = "Create a new app-schema migration file"
usage = 'arg "<name>" help="Name of the migration"'
run = "migrate create -ext sql -dir database/migrations/app -seq \"${usage_name:?}\""

[tasks."auth:install"]
description = "Install auth-server dependencies"
dir = "auth"
run = "pnpm install"

[tasks."auth:dev"]
description = "Run the BetterAuth auth-server with hot-reload"
dir = "auth"
run = "pnpm dev"

[tasks."auth:migrate"]
description = "Apply BetterAuth schema migrations"
dir = "auth"
run = "pnpm migrate"

[tasks."seed:super-admin"]
description = "Create a super-admin user (interactive)"
run = "go run ./cmd/seed-super-admin"

[tasks."seed:demo"]
description = "Seed demo camp data (idempotent: deletes and recreates)"
run = "go run ./cmd/seed-demo"

[tasks."db:reset"]
description = "Destroy and recreate the local databases (next 'mise run dev' reinitializes)"
run = "docker compose down -v"

[tasks.web]
description = "Start the frontend dev server with HMR"
dir = "web"
run = "pnpm dev"

[tasks."web:build"]
description = "Build the frontend for production"
dir = "web"
run = "pnpm build"

[tasks."web:check"]
description = "Type-check the frontend"
dir = "web"
run = "pnpm check"
